{% extends "layouts/base_tailwind.html" %}
{% block title %}¡Contraseña actualizada!{% endblock %}

{% block content %}
<div class="container mx-auto flex min-h-[calc(100vh-200px)] max-w-md items-center justify-center px-4 py-12">
  <div class="w-full text-center">
    <div class="mb-8">
      <div class="mb-4 inline-flex h-20 w-20 items-center justify-center rounded-full bg-green-100">
        <svg class="h-10 w-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-900">¡Perfecto!</h1>
    </div>

    <div class="overflow-hidden rounded-xl border border-gray-200 bg-white px-8 py-10 shadow-lg">
      <div class="mb-8">
        <div class="mb-4 inline-flex h-16 w-16 items-center justify-center rounded-full bg-green-50">
          <svg class="h-8 w-8 text-green-600" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <h2 class="mb-3 text-xl font-bold text-gray-900">Contraseña actualizada</h2>
        <p class="text-gray-600">
          Tu contraseña fue <strong>cambiada correctamente</strong>.
        </p>
      </div>
      <a href="{% url 'home' %}" 
         class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-gradient-to-r from-green-600 to-emerald-600 px-6 py-3 text-center text-sm font-semibold text-white shadow-md transition-all hover:from-green-700 hover:to-emerald-700 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-green-300">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        Volver al inicio
      </a>
    </div>
  </div>
</div>
{% endblock %}
