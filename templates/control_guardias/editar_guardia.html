<form method="post" action="{% url 'control_guardias:editar_guardia' pk=form.instance.pk %}" class="space-y-4">
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div class="rounded-md border border-red-300 bg-red-50 p-2 text-sm text-red-700">{{ form.non_field_errors }}</div>
  {% endif %}
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Franja horaria</label>
      {{ form.franja_horaria }}
      {{ form.franja_horaria.errors }}
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Médico</label>
      {{ form.medico }}
      {{ form.medico.errors }}
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Fecha</label>
      {{ form.fecha }}
      {{ form.fecha.errors }}
    </div>
  </div>
  <div class="flex items-center justify-end gap-2 pt-2">
    <button type="submit" class="inline-flex items-center rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white shadow hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">Guardar cambios</button>
  </div>
</form>
