{% comment %}
AUTH HEADER COMPONENT
Encabezado consistente para todas las páginas de autenticación
Uso: {% include 'components/auth_header.html' with icon='fa-icon' title='Título' subtitle='Subtítulo' %}
{% endcomment %}

<div class="text-center mb-8">
    <div class="mx-auto h-16 w-16 bg-gradient-to-br from-blue-600 to-blue-700 rounded-2xl flex items-center justify-center mb-4 shadow-lg transform hover:scale-105 transition-transform duration-300">
        <i class="fas {{ icon }} text-white text-2xl"></i>
    </div>
    <h1 class="text-3xl font-extrabold text-gray-900 mb-2">
        {{ title }}
    </h1>
    {% if subtitle %}
    <p class="text-sm text-gray-600">
        {{ subtitle }}
    </p>
    {% endif %}
</div>
