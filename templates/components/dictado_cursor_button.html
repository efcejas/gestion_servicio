<div id="dictado-anchor" class="mt-2 flex items-center gap-2">
    <button
        type="button"
        id="dictado-toggle"
        class="dictado-toggle-button inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium bg-purple-100 text-purple-700 hover:bg-purple-200 transition"
        title="Atajo: Alt + Shift + D"
        aria-pressed="false"
    >
        <i class="fas fa-microphone mr-2"></i>
        Iniciar dictado
    </button>
    <span id="dictado-status" class="text-xs text-gray-600">Dictado en cursor listo (Alt + Shift + D).</span>
</div>
