{% if examen and examen.pk %}
<nav aria-label="Progreso de la evaluación" class="mb-6 overflow-x-auto rounded-xl border border-gray-200 bg-white p-3 shadow-sm">
    <ol class="flex min-w-[42rem] items-center justify-between gap-2 text-xs sm:text-sm">
        {% with paso=active_step|default:'datos' %}
        <li class="flex items-center gap-2 {% if paso == 'datos' %}font-semibold text-medical-primary{% else %}text-gray-500{% endif %}">
            <a href="{% url 'evaluaciones_residentes:editar' examen.pk %}" class="flex items-center gap-2 whitespace-nowrap rounded-lg px-2 py-1.5 hover:bg-gray-50">
                <span class="flex h-7 w-7 items-center justify-center rounded-full {% if paso == 'datos' %}bg-medical-primary text-white{% else %}bg-gray-100 text-gray-600{% endif %}">1</span>Datos generales
            </a>
        </li>
        <li class="h-px min-w-4 flex-1 bg-gray-200" aria-hidden="true"></li>
        <li class="flex items-center gap-2 {% if paso == 'preguntas' %}font-semibold text-medical-primary{% else %}text-gray-500{% endif %}">
            <a href="{% url 'evaluaciones_residentes:preguntas' examen.pk %}" class="flex items-center gap-2 whitespace-nowrap rounded-lg px-2 py-1.5 hover:bg-gray-50">
                <span class="flex h-7 w-7 items-center justify-center rounded-full {% if paso == 'preguntas' %}bg-medical-primary text-white{% else %}bg-gray-100 text-gray-600{% endif %}">2</span>Preguntas
            </a>
        </li>
        <li class="h-px min-w-4 flex-1 bg-gray-200" aria-hidden="true"></li>
        <li class="flex items-center gap-2 {% if paso == 'revision' %}font-semibold text-medical-primary{% else %}text-gray-500{% endif %}">
            <a href="{% url 'evaluaciones_residentes:revision' examen.pk %}" class="flex items-center gap-2 whitespace-nowrap rounded-lg px-2 py-1.5 hover:bg-gray-50">
                <span class="flex h-7 w-7 items-center justify-center rounded-full {% if paso == 'revision' %}bg-medical-primary text-white{% else %}bg-gray-100 text-gray-600{% endif %}">3</span>Revisar y publicar
            </a>
        </li>
    </ol>
</nav>
        {% endwith %}
{% endif %}
