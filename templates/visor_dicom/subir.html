{% extends 'layouts/base_with_sidebar.html' %}
{% block content %}
<div class="max-w-lg mx-auto py-10">
    <h1 class="text-2xl text-gray-800 dark:text-gray-200 font-bold mb-4">Subir archivo DICOM</h1>
    <form method="post" enctype="multipart/form-data"
        class="space-y-4 text-white bg-white dark:bg-gray-800 p-6 rounded-lg shadow">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Subir y visualizar</button>
    </form>
</div>
{% endblock %}
